name: Report a flashcard issue
description: Something is wrong or unclear on a flashcard
title: "[Card] "
labels: ["card-feedback"]
body:
  - type: input
    id: card
    attributes:
      label: Card
      description: The card name, pre-filled from the site.
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject
      description: Pre-filled from the site.
  - type: dropdown
    id: category
    attributes:
      label: What kind of issue is it?
      options:
        - Incorrect answer or explanation
        - Unclear question
        - Typo or formatting
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix or source (optional)
